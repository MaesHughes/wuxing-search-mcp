# SearXNG 配置文件 - Wuxing Search
# 版本: 2026.1.24+eea189286 (219 个引擎)
# 引擎选择策略：由 MCP Server 通过 API engines 参数动态指定
# settings.yml 保持默认配置，避免因引擎 network 缺失导致启动崩溃
use_default_settings: true

general:
  instance_name: "Wuxing Search"

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "wuxing-search-secret-key-change-in-production"
  limiter: false
  public_instance: false
  method: "POST"
  image_proxy: false

search:
  formats:
    - html
    - json
    - csv
  max_results: 20

outgoing:
  request_timeout: 10.0
  pool_connections: 100
  pool_maxsize: 20
