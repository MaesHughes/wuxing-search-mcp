# SearXNG 配置文件 - Wuxing Search
# 版本: 2026.1.24+eea189286 (219 个引擎)
# 引擎选择策略：由 MCP Server 通过 API engines 参数动态指定
# settings.yml 保持默认配置，避免因引擎 network 缺失导致启动崩溃
use_default_settings: true

general:
  instance_name: "Wuxing Search"

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "wuxing-search-secret-key-change-in-production"
  limiter: false
  public_instance: false
  method: "POST"
  image_proxy: false

search:
  formats:
    - html
    - json
    - csv
  max_results: 20

outgoing:
  request_timeout: 6.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20
  suspension_time: 600

engines:
  # === 高风险引擎（禁用） ===
  - name: google
    disabled: true
  - name: startpage
    disabled: true

  # === 稳定的独立索引引擎（优先启用） ===
  - name: brave
    disabled: false
  - name: mojeek
    disabled: false

  # === 通用搜索（稳定备选） ===
  - name: duckduckgo
    disabled: false
  - name: yahoo
    disabled: false
  - name: qwant
    disabled: false

  # === 中文搜索引擎 ===
  - name: 360search
    disabled: false
  - name: baidu kaifa
    disabled: false
  - name: sogou wechat
    disabled: false
