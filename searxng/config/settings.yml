# SearXNG 配置文件 - Wuxing Search
use_default_settings: true
general:
  instance_name: "Wuxing Search"
server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "wuxing-search-secret-key-change-in-production"
  limiter: false
  public_instance: false
  method: "POST"
  image_proxy: false
search:
  formats:
    - html
    - json
    - csv
  max_results: 20

outgoing:
  request_timeout: 10.0
  pool_connections: 100
  pool_maxsize: 20

engines:
  - name: google
    timeout: 10.0
  - name: bing
    timeout: 10.0
  - name: duckduckgo
    timeout: 10.0
  - name: baidu
    timeout: 10.0
